name: Keep backend alive

# Render's free tier spins the backend down after ~15 min of inactivity,
# with a cold-start wake-up of up to ~50s on the next real request. This
# pings the health endpoint every 10 minutes to keep it warm for anyone
# actively testing the app. Costs nothing (GitHub Actions free minutes) and
# is safe to delete once the backend is on a paid always-on tier.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -sf https://restuarant-portal-liqeta-app.onrender.com/ || echo "Backend did not respond (may just be waking up)"
