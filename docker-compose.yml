name: restaurant-platform

services:
  postgres:
    # postgis/postgis instead of the plain postgres image - same Postgres 16
    # underneath, just with the PostGIS extension available for spatial
    # queries (e.g. future "restaurants near me" search). Fully compatible
    # with data written under the plain image; nothing about the data
    # files themselves changes by adding extension binaries.
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: restaurant
      POSTGRES_DB: restaurant_platform
    ports:
      - "5432:5432"
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant -d restaurant_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: restaurant
      MINIO_ROOT_PASSWORD: restaurant123
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - ./.docker-data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
